dq_framework:
  version: "1.0"

  checks:

    - id: DQ1
      name: completeness
      description: Check required columns for null values
      category: completeness
      level: column
      enabled: true
      default_weight: 10

    - id: DQ2
      name: accuracy
      description: Validate values against expected business values
      category: accuracy
      level: column
      enabled: true
      default_weight: 10

    - id: DQ3
      name: validity
      description: Validate values against allowed formats and rules
      category: validity
      level: column
      enabled: true
      default_weight: 10

    - id: DQ4
      name: uniqueness
      description: Check duplicate records or keys
      category: uniqueness
      level: dataset
      enabled: true
      default_weight: 10

    - id: DQ5
      name: consistency
      description: Validate consistency between related fields
      category: consistency
      level: dataset
      enabled: true
      default_weight: 7

    - id: DQ6
      name: integrity
      description: Validate relationships between datasets
      category: integrity
      level: dataset
      enabled: true
      default_weight: 7

    - id: DQ7
      name: timeliness
      description: Check whether data is available within expected time
      category: timeliness
      level: dataset
      enabled: true
      default_weight: 7

    - id: DQ8
      name: conformity
      description: Validate data against organizational standards
      category: conformity
      level: column
      enabled: true
      default_weight: 5

    - id: DQ9
      name: range
      description: Validate numeric values within expected ranges
      category: range
      level: column
      enabled: true
      default_weight: 5

    - id: DQ10
      name: duplicate
      description: Identify duplicate records or duplicate business keys
      category: duplicate
      level: dataset
      enabled: true
      default_weight: 7

    - id: DQ11
      name: "null"
      description: Identify unexpected null values
      category: null_check
      level: column
      enabled: true
      default_weight: 8

    - id: DQ12
      name: length
      description: Validate text field length
      category: length
      level: column
      enabled: true
      default_weight: 4

    - id: DQ13
      name: data_type
      description: Validate expected data types
      category: data_type
      level: column
      enabled: true
      default_weight: 6

    - id: DQ14
      name: pattern
      description: Validate values against regular expression patterns
      category: pattern
      level: column
      enabled: true
      default_weight: 5

    - id: DQ15
      name: business_rule
      description: Validate business-specific rules
      category: business_rule
      level: dataset
      enabled: true
      default_weight: 9

    - id: DQ16
      name: volume
      description: Detect unexpected changes in record volume
      category: volume
      level: dataset
      enabled: true
      default_weight: 5